<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Metropolitan Museum API</title>
  </head>

  <body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <!-- Encabezado -->

   <header
  class="text-center bg-cover bg-center border-4 border-amber-700 rounded-2xl shadow-2xl mx-6 my-6 overflow-hidden"
  style="background-image: url('imagenes/Museo_del_prado.jpg');"
>
>

  <div class="bg-black/60 p-8">

    <h1 class="text-3xl md:text-5xl font-extrabold text-blue-400 uppercase pb-6">
      Metropolitan Museum API
    </h1>

    <div class="flex flex-col md:flex-row flex-wrap justify-center items-center gap-4">

      <button
        id="btnCargar"
        class="bg-blue-600 hover:bg-blue-800 text-white font-bold py-3 px-8 rounded-lg text-lg transition"
      >
        Cargar Obras
      </button>

      <button
        id="btnModoOscuro"
        class="bg-amber-700 hover:bg-amber-800 text-white font-bold py-3 px-8 rounded-lg text-lg transition"
      >
        🌙 Modo Oscuro
      </button>

      <button
        id="btnFavoritos"
        class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-lg text-lg transition"
      >
        ❤️ Ver Favoritos
      </button>

      <input
        type="text"
        id="txtBuscar"
        placeholder="Buscar por título o artista..."
        class="w-80 max-w-full px-4 py-2 rounded-lg border-2 border-yellow-500 text-black"
      />

    </div>

  </div>

</header>

    </div>

    <!-- Contenedor de tarjetas -->

    <main>
      <div
        id="museo-contenedor"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 p-6"
      ></div>
    </main>

    <!-- Modal -->

    <div
      id="modal"
      class="fixed inset-0 bg-black/70 hidden justify-center items-center z-50"
    >
      <!-- Caja del modal -->

      <div
        class="bg-white text-black rounded-xl shadow-xl w-11/12 max-w-lg p-6 relative"
      >
        <!-- Botón cerrar -->

        <button
          id="btnCerrar"
          class="absolute top-3 right-4 text-2xl font-bold text-red-600 hover:text-red-800"
        >
          ✖
        </button>

        <!-- Aquí se cargan los datos desde JavaScript -->

        <div id="detalle"></div>
      </div>
    </div>

    <!-- JavaScript -->

    <script src="metropolitanmuseum.js"></script>
  </body>
</html>
